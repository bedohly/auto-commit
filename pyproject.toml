[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocommit"
version = "1.3.0"
description = "Automate your GitHub contribution graph: scheduled random commits, issues and pull requests."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
  "github", "github-activity", "contribution-graph", "auto-commit", "commit-bot",
  "git-automation", "automation", "scheduler", "cli", "cross-platform",
]
dependencies = []

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/Bedohly/github-activity-bot"
Source = "https://github.com/Bedohly/github-activity-bot"
Issues = "https://github.com/Bedohly/github-activity-bot/issues"

[project.scripts]
autocommit = "autocommit.cli:main"

[tool.setuptools]
packages = ["autocommit"]
