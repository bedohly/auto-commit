[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocommit"
version = "1.0.0"
description = "Create randomized commits in a GitHub repository you own, on a schedule."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["git", "github", "commits", "automation", "scheduler"]
dependencies = []

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
autocommit = "autocommit.cli:main"

[tool.setuptools]
packages = ["autocommit"]
