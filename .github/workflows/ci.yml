name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show tool versions
        run: |
          python --version
          git --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke test the installed CLI
        run: |
          autocommit --version
          autocommit --help
          autocommit status
          autocommit config --show

      - name: Smoke test the console
        shell: bash
        run: |
          cat > session.txt <<'EOF'
          /help
          /status
          /config
          /log
          /set max_commits 4
          /quit
          EOF
          autocommit console < session.txt | tee console.out
          grep -q "AUTOCOMMIT" console.out
          grep -q "/unschedule" console.out
          grep -q "max_commits = 4" console.out

      - name: Console falls back to ASCII on demand
        shell: bash
        env:
          AUTOCOMMIT_ASCII: "1"
        run: |
          printf '%s\n' /status /quit > ascii.txt
          autocommit console < ascii.txt | tee ascii.out
          grep -q '+---' ascii.out

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile every module
        run: python -m compileall -q autocommit tests
      - name: Check the shell installer
        run: sh -n install.sh
