name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show tool versions
        run: |
          python --version
          git --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke test the installed CLI
        run: |
          autocommit --version
          autocommit --help
          autocommit status
          autocommit config --show

  lint:
    name: syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile every module
        run: python -m compileall -q autocommit tests
      - name: Check the shell installer
        run: sh -n install.sh
